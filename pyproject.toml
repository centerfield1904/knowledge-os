[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-os"
version = "0.1.0"
description = "Multi-source digest pipeline with semantic topic matching and engagement detection."
requires-python = ">=3.9"

[project.scripts]
knowledge-os-init-schema = "knowledge_os.schema:main"
knowledge-os-score-topics = "knowledge_os.topic_scoring:main"
knowledge-os-load-subscriptions = "knowledge_os.subscriptions:main"
knowledge-os-feedback = "knowledge_os.feedback_events:main"
knowledge-os-persona-digest = "knowledge_os.persona_digest:main"
knowledge-os-gap-summary = "knowledge_os.gap_summary:main"
knowledge-os-query = "knowledge_os.query_pipeline:main"
knowledge-os-personas = "knowledge_os.personas:main"
knowledge-os-whatsapp-delivery = "knowledge_os.whatsapp_delivery:main"

[tool.setuptools.packages.find]
where = ["src"]
